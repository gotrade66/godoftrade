<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부고 · 故 김기순님</title>
<meta name="description" content="故 김기순님께서 2026년 10월 21일 별세하셨기에 삼가 알려드립니다. 빈소: 한일병원장례식장 1호실">
<meta property="og:type" content="website">
<meta property="og:title" content="[부고] 故 김기순님께서 별세하셨습니다">
<meta property="og:description" content="빈소: 한일병원장례식장 1호실 · 발인: 2026년 10월 23일(금)">
<meta property="og:image" content="og.png">
<meta name="theme-color" content="#1f1f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee;
    --card: #fffefb;
    --ink: #222;
    --muted: #6b6762;
    --line: #e2ded7;
    --accent: #1f1f1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 0 16px 56px; }
  .serif { font-family: "Noto Serif KR", serif; }

  header {
    text-align: center;
    padding: 56px 0 32px;
  }
  .hanja {
    font-family: "Noto Serif KR", serif;
    font-size: 15px;
    letter-spacing: .6em;
    color: var(--muted);
    margin-left: .6em;
  }
  .ribbon { display: block; margin: 20px auto 0; }

  .photo {
    width: 180px;
    aspect-ratio: 3 / 4;
    margin: 0 auto;
    border: 1px solid var(--line);
    background: #ebe8e2;
    padding: 8px;
    position: relative;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1); }
  .photo .ph {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    color: #9b968f; font-size: 13px;
  }
  .photo::after {
    /* 검은 띠 */
    content: "";
    position: absolute; top: 0; right: 0;
    width: 42px; height: 42px;
    background: linear-gradient(225deg, var(--accent) 0 30%, transparent 30%);
  }

  .name {
    text-align: center;
    margin-top: 28px;
  }
  .name h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: .08em;
  }
  .name h1 small { font-size: 18px; font-weight: 600; margin-right: 6px; }
  .name p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .message {
    font-family: "Noto Serif KR", serif;
    text-align: center;
    font-size: 15.5px;
    margin: 32px 0 8px;
    color: #3a3733;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 24px 20px;
    margin-top: 20px;
  }
  .card h2 {
    font-family: "Noto Serif KR", serif;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    letter-spacing: .2em;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  dl { display: grid; grid-template-columns: 64px 1fr; row-gap: 12px; column-gap: 12px; }
  dt { color: var(--muted); font-size: 14px; }
  dd { font-size: 15px; }
  dd .sub { display: block; color: var(--muted); font-size: 13px; }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: inherit; font-size: 14px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:active { background: #f1efea; }
  .btn.full { grid-column: 1 / -1; }
  .btn.dark { background: var(--accent); color: #fff; border-color: var(--accent); }

  .people { display: grid; grid-template-columns: 64px 1fr; row-gap: 8px; column-gap: 12px; font-size: 15px; }
  .people span:nth-child(odd) { color: var(--muted); font-size: 14px; }

  .acct { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .acct:first-of-type { border-top: 0; padding-top: 0; }
  .acct .who { font-size: 13px; color: var(--muted); }
  .acct .num { font-size: 15px; }
  .acct .btn { min-height: 36px; padding: 0 14px; flex-shrink: 0; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 36px; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,30,.92); color: #fff; font-size: 14px;
    padding: 10px 18px; border-radius: 20px;
    opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hanja">謹弔</div>
    <svg class="ribbon" width="36" height="44" viewBox="0 0 36 44" aria-hidden="true">
      <path d="M18 4 C10 4 6 10 10 16 L18 26 L26 16 C30 10 26 4 18 4 Z" fill="none" stroke="#222" stroke-width="2.2"/>
      <path d="M14 22 L6 42 L12 38 L15 43 L19 28 Z M22 22 L30 42 L24 38 L21 43 L17 28 Z" fill="#222"/>
    </svg>
  </header>

  <div class="photo">
    <img src="photo.jpg" alt="故 김기순님 영정" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'故 김기순'}))">
  </div>

  <section class="name">
    <h1><small>故</small>김기순</h1>
    <p>향년 81세</p>
  </section>

  <p class="message">
    그동안 베풀어 주신 은혜에 감사드리며<br>
    삼가 고인의 별세를 알려드립니다.<br>
    부디 오셔서 고인의 마지막 길을<br>
    함께해 주시기 바랍니다.
  </p>

  <section class="card">
    <h2>장례 일정</h2>
    <dl>
      <dt>별세</dt><dd>2026년 10월 21일 (수)</dd>
      <dt>발인</dt><dd>2026년 10월 23일 (금)</dd>
      <dt>장지</dt><dd>경북 상주시 외남리</dd>
    </dl>
  </section>

  <section class="card">
    <h2>빈소</h2>
    <dl>
      <dt>장소</dt><dd>한일병원장례식장 <strong>1호실</strong></dd>
      <dt>주소</dt><dd>서울특별시 도봉구 우이천로 308<span class="sub">한일병원 (쌍문동)</span></dd>
    </dl>
    <div class="btns">
      <a class="btn" href="https://map.naver.com/p/search/%ED%95%9C%EC%9D%BC%EB%B3%91%EC%9B%90%EC%9E%A5%EB%A1%80%EC%8B%9D%EC%9E%A5" target="_blank" rel="noopener">네이버 지도</a>
      <a class="btn" href="https://map.kakao.com/link/search/%ED%95%9C%EC%9D%BC%EB%B3%91%EC%9B%90%EC%9E%A5%EB%A1%80%EC%8B%9D%EC%9E%A5" target="_blank" rel="noopener">카카오맵</a>
      <button class="btn full" data-copy="서울특별시 도봉구 우이천로 308 한일병원장례식장 1호실">주소 복사</button>
    </div>
  </section>

  <!-- 상주·유족: 정보를 받으면 주석을 풀고 채웁니다
  <section class="card">
    <h2>상주</h2>
    <div class="people">
      <span>배우자</span><span>○○○</span>
      <span>자</span><span>○○○</span>
      <span>여</span><span>○○○</span>
      <span>사위</span><span>○○○</span>
    </div>
  </section>
  -->

  <!-- 부의금 계좌: 정보를 받으면 주석을 풀고 채웁니다
  <section class="card">
    <h2>마음 전하실 곳</h2>
    <div class="acct">
      <div><div class="who">상주 ○○○</div><div class="num">○○은행 000-0000-0000</div></div>
      <button class="btn" data-copy="○○은행 000-0000-0000">복사</button>
    </div>
  </section>
  -->

  <div class="btns" style="margin-top:28px">
    <button class="btn dark full" id="share">부고 전달하기</button>
  </div>

  <footer class="serif">삼가 고인의 명복을 빕니다</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const toast = (msg) => {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1800);
  };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('복사되었습니다');
  };
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b.dataset.copy)));
  document.getElementById('share').addEventListener('click', async () => {
    const data = { title: '[부고] 故 김기순님께서 별세하셨습니다', text: '빈소: 한일병원장례식장 1호실 · 발인: 10월 23일(금)', url: location.href };
    if (navigator.share) { try { await navigator.share(data); } catch {} }
    else copy(location.href);
  });
</script>
</body>
</html>
