<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B · 다크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#e9e6e0;font-family:"Noto Serif KR",serif;line-height:1.8}
.wrap{max-width:440px;margin:0 auto;padding:0 16px 56px}
.top{text-align:center;padding:64px 0 36px}
.top .t{font-size:13px;letter-spacing:.5em;color:#a29a8b;margin-left:.5em}
.top .line{width:1px;height:40px;background:#5a554d;margin:20px auto}
.flower{display:block;margin:0 auto 28px}
.photo{width:170px;aspect-ratio:3/4;margin:0 auto;border:1px solid #3a3733;padding:6px;background:#1c1c1c}
.photo div{width:100%;height:100%;display:grid;place-items:center;color:#5e5a54;font-size:13px;background:#232323}
h1{text-align:center;font-size:30px;font-weight:600;letter-spacing:.12em;margin-top:28px}
h1 small{font-size:18px;color:#a29a8b;margin-right:8px}
.age{text-align:center;color:#8b857b;font-size:14px}
.msg{text-align:center;font-weight:300;font-size:15px;color:#c9c4bb;margin:36px 0}
.sec{border-top:1px solid #2e2c29;padding:28px 4px}
.sec h2{font-size:12px;letter-spacing:.4em;color:#a29a8b;font-weight:400;margin-bottom:16px}
.row{display:flex;gap:16px;font-size:15px;padding:4px 0}
.row b{width:56px;flex-shrink:0;font-weight:400;color:#8b857b;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{min-height:44px;border:1px solid #3a3733;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#e9e6e0;font-size:14px;text-decoration:none;background:none;font-family:inherit}
.full{grid-column:1/-1}.gold{background:#c8b58a;color:#141414;border-color:#c8b58a}
footer{text-align:center;color:#6f6a62;font-size:13px;margin-top:32px}
</style></head><body><div class="wrap">
<div class="top"><div class="t">訃 告</div><div class="line"></div></div>
<svg class="flower" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#d9d4ca" stroke-width="1.2">
<circle cx="32" cy="26" r="5"/><path d="M32 21c-3-8 3-14 0-18M32 21c3-8-3-14 0-18"/>
<path d="M27 26c-8-3-14 3-18 0M27 26c-8 3-14-3-18 0M37 26c8-3 14 3 18 0M37 26c8 3 14-3 18 0"/>
<path d="M28 22c-6-6-12-4-15-9M36 22c6-6 12-4 15-9M28 30c-6 6-12 4-15 9M36 30c6 6 12 4 15 9"/>
<path d="M32 31v30M32 48c-6-4-10-2-12-6M32 52c6-4 10-2 12-6"/></g></svg>
<div class="photo"><div>영정 사진</div></div>
<h1><small>故</small>김기순</h1><p class="age">향년 81세</p>
<p class="msg">그동안 베풀어 주신 은혜에 감사드리며<br>삼가 고인의 별세를 알려드립니다.</p>
<div class="sec"><h2>장례 일정</h2>
<div class="row"><b>별세</b>2026. 10. 21 (수)</div><div class="row"><b>발인</b>2026. 10. 23 (금)</div><div class="row"><b>장지</b>경북 상주시 외남리</div></div>
<div class="sec"><h2>빈소</h2>
<div class="row"><b>장소</b>한일병원장례식장 1호실</div><div class="row"><b>주소</b>서울특별시 도봉구 우이천로 308</div>
<div class="btns"><a class="btn">네이버 지도</a><a class="btn">카카오맵</a><button class="btn full">주소 복사</button></div></div>
<div class="btns"><button class="btn gold full">부고 전달하기</button></div>
<footer>삼가 고인의 명복을 빕니다</footer></div></body></html>
