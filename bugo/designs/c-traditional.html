<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 C · 전통</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e4d8;color:#2b2722;font-family:"Nanum Myeongjo",serif;line-height:1.8}
.wrap{max-width:440px;margin:0 auto;padding:24px 16px 56px}
.paper{background:#f8f4ea;border:1px solid #d6cfbf;outline:6px double #b9b09c;outline-offset:-14px;padding:44px 28px}
.head{display:flex;justify-content:center;gap:28px;align-items:flex-start;margin-bottom:28px}
.v{display:flex;flex-direction:column;gap:14px;font-family:"Noto Serif KR",serif;font-size:40px;font-weight:700;line-height:1;color:#1d1a16}
.photo{width:140px;aspect-ratio:3/4;border:1px solid #cfc7b5;padding:5px;background:#efe9db;position:relative}
.photo div{width:100%;height:100%;display:grid;place-items:center;color:#a49b88;font-size:12px}
.photo:before,.photo:after{content:"";position:absolute;top:0;width:3px;height:100%;background:#1d1a16}
.photo:before{left:-10px}.photo:after{right:-10px}
h1{text-align:center;font-size:28px;font-weight:800;letter-spacing:.2em}
h1 small{font-size:17px;font-weight:400}
.age{text-align:center;font-size:14px;color:#6e6658}
.msg{text-align:center;font-size:15px;margin:28px 0;padding:20px 0;border-top:1px solid #d6cfbf;border-bottom:1px solid #d6cfbf}
table{width:100%;border-collapse:collapse;font-size:15px}
th{width:60px;text-align:left;font-weight:700;color:#6e6658;font-size:14px;padding:7px 0;vertical-align:top}
td{padding:7px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.btn{min-height:44px;border:1px solid #b9b09c;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:inherit;background:#fffdf7;color:#2b2722}
.full{grid-column:1/-1}.ink{background:#2b2722;color:#f8f4ea;border-color:#2b2722}
footer{text-align:center;font-size:14px;margin-top:28px;color:#6e6658}
</style></head><body><div class="wrap"><div class="paper">
<div class="head"><div class="v"><span>訃</span><span>告</span></div><div class="photo"><div>영정 사진</div></div></div>
<h1><small>故</small> 김기순</h1><p class="age">향년 81세</p>
<p class="msg">그동안 베풀어 주신 은혜에 감사드리며<br>삼가 고인의 별세를 알려드립니다.</p>
<table>
<tr><th>별세</th><td>2026년 10월 21일 (수)</td></tr>
<tr><th>빈소</th><td>한일병원장례식장 1호실</td></tr>
<tr><th>주소</th><td>서울특별시 도봉구 우이천로 308</td></tr>
<tr><th>발인</th><td>2026년 10월 23일 (금)</td></tr>
<tr><th>장지</th><td>경북 상주시 외남리</td></tr>
</table>
<div class="btns"><button class="btn">네이버 지도</button><button class="btn">카카오맵</button><button class="btn full ink">부고 전달하기</button></div>
<footer>삼가 고인의 명복을 빕니다</footer>
</div></div></body></html>
