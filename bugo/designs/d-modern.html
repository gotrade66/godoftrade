<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 D · 모던</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#1a1a1a;font-family:"Noto Sans KR",sans-serif;line-height:1.7}
.wrap{max-width:440px;margin:0 auto;padding:0 0 56px}
.hero{background:#2a2a2a;color:#fff;text-align:center;padding:48px 16px 96px}
.hero .t{font-size:12px;letter-spacing:.4em;opacity:.6}
.hero h1{font-size:26px;font-weight:500;margin-top:14px}
.hero p{font-size:14px;opacity:.7}
.photo{width:150px;aspect-ratio:3/4;margin:-76px auto 0;background:#eee;border:4px solid #fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:grid;place-items:center;color:#aaa;font-size:13px}
.msg{text-align:center;font-weight:300;font-size:15px;color:#555;margin:28px 16px}
.box{margin:0 16px 16px;background:#f6f6f6;border-radius:14px;padding:22px 20px}
.box h2{font-size:13px;font-weight:700;color:#888;margin-bottom:14px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:#ccc}
.it{position:relative;padding:4px 0 12px}
.it:before{content:"";position:absolute;left:-21px;top:11px;width:9px;height:9px;border-radius:50%;background:#2a2a2a}
.it small{display:block;color:#888;font-size:12px}
.it strong{font-weight:500;font-size:16px}
.place strong{display:block;font-size:17px;font-weight:500}
.place span{font-size:14px;color:#666}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{min-height:46px;border:0;border-radius:10px;background:#fff;font-family:inherit;font-size:14px;color:#1a1a1a}
.full{grid-column:1/-1}.dk{background:#2a2a2a;color:#fff}
.share{margin:8px 16px 0}
footer{text-align:center;color:#999;font-size:13px;margin-top:28px}
</style></head><body><div class="wrap">
<div class="hero"><div class="t">謹弔</div><h1>故 김기순님</h1><p>향년 81세 · 2026년 10월 21일 별세</p></div>
<div class="photo">영정 사진</div>
<p class="msg">그동안 베풀어 주신 은혜에 감사드리며<br>삼가 고인의 별세를 알려드립니다.</p>
<div class="box"><h2>장례 일정</h2><div class="tl">
<div class="it"><small>별세</small><strong>10월 21일 (수)</strong></div>
<div class="it"><small>발인</small><strong>10월 23일 (금)</strong></div>
<div class="it"><small>장지</small><strong>경북 상주시 외남리</strong></div></div></div>
<div class="box place"><h2>빈소</h2><strong>한일병원장례식장 1호실</strong><span>서울특별시 도봉구 우이천로 308</span>
<div class="btns"><button class="btn">네이버 지도</button><button class="btn">카카오맵</button></div></div>
<div class="btns share"><button class="btn full dk">부고 전달하기</button></div>
<footer>삼가 고인의 명복을 빕니다</footer></div></body></html>
